warnings:
  - 单节 3.7 V。必须用锂电池专用 CC/CV 充电器，不要把裸线直接接到 5 V。
  - 默认发两线裸线，插头未核。商家可选 1.25 / 2.0 / 2.54，红黑极性不要接反。
  - 商品把 503450 与 523450 当通用；主图标签有 523450 也有 503450。厚度商品页写 5 mm，以实物为准。
  - 商家参数列表与保护板表不完全一致（过放 2.7 V vs 2.50 V，过流 3.0±1.0 A vs 2.0±0.5 A）。保护阈值以保护板表为准，放电不要按 3 A 满打。
notes:
  - 带 BW-1835 保护板：B+/B− 接电芯，P+/P− 充放电共用。过充 / 过放 / 过流 / 短路。
  - 可给 ESP32-C6 SuperMini 的 B+/B− 用（单节带保护板）。接线见 devices，不要在这边复制针序。
  - 循环寿命商家写 500 次以上容量约到 80%。
  - 不焊在自制 PCB 上，无封装问题。
