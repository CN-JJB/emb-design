warnings:
  - 编码器由电机座 3V3 供电，H2 的 5V 是辅助输出，不要当成编码器电平。
  - 与 MG513 的 XH2.54-6P 线序方向相反，接线前先量第 5 脚对第 2 脚是否为 3.3 V。
  - 主电源未通时不要从 MCU IO 反灌。
  - 持续电流按 1.2 A/路，3.2 A 不能当连续能力。
